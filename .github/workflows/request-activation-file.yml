name: Request Unity license activation file

# One-time-use helper for setting up 0.6 CI/CD's UNITY_LICENSE secret.
# Run this manually (Actions tab -> this workflow -> Run workflow), download the
# resulting .alf artifact, upload it at https://license.unity3d.com/manual to get
# a .ulf file back, then paste that .ulf's contents into the UNITY_LICENSE repo
# secret. Delete this workflow file once the secret is set — it has no ongoing use.

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request activation file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v6000.5.8f1.alf
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
